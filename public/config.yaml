# Initial (first run) file access mode - user's device or /music directory on server
# local | server
defaultAccessMode: local

# Whether to enable access to local device (true allows user to switch between local or server)
# true | false
enableLocalAccess: true

# Initial state of the Media Panel ("close" expands the analyzer area)
# open | close
frontPanel: open

# Whether to preserve filenames as is in the play queue
# true | false
preserveFilenames: false

# Built-in presets
# keyname: description
# settings stored in corresponding "preset_<keyname>.json" file
presets:
- defaults: Defaults  # This keyname is associated with the "Defaults" button
- demo: Demo (random) # This keyname will randomize settings when the preset is loaded
- ledbars: Classic LED bars
- dualgraph: Dual-channel combined Graph
- reflex: Octave Bands + Reflex
- radial: Radial, Color by Level
- roundbars: Round Bars, Color by Index
